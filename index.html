/* ===== APARIENCIA: BLANCO/NEGRO + COLOR ===== */
var TK="rutinaGymTheme",AK="rutinaGymAccent",ACC="#e8590c";
var PRE=["#e8590c","#e03131","#d6336c","#ae3ec9","#4263eb","#1c7ed6","#0ca678","#2f9e44","#f59f00"];
function hexRGB(h){return [parseInt(h.substr(1,2),16),parseInt(h.substr(3,2),16),parseInt(h.substr(5,2),16)]}
function setTheme(t,nosave){
 document.documentElement.setAttribute("data-theme",t);
 if(!nosave)try{localStorage.setItem(TK,t)}catch(e){}
 document.getElementById("thL").className=t=="light"?"on":"";
 document.getElementById("thD").className=t=="dark"?"on":"";
 document.getElementById("tc").setAttribute("content",t=="dark"?"#101216":"#f4f5f7")}
function setAccent(h,nosave){
 h=String(h).toLowerCase();if(!/^#[0-9a-f]{6}$/.test(h))return;
 ACC=h;var c=hexRGB(h),l=.299*c[0]+.587*c[1]+.114*c[2],st=document.documentElement.style;
 st.setProperty("--ac",h);st.setProperty("--act",l>165?"#14171c":"#fff");
 if(!nosave)try{localStorage.setItem(AK,h)}catch(e){}
 var isPre=false;
 document.querySelectorAll("#sws .sw[data-c]").forEach(function(b){var on=b.dataset.c==h;if(on)isPre=true;b.className="sw"+(on?" on":"")});
 var cu=document.getElementById("swc");cu.className="sw cust"+(isPre?"":" on");document.getElementById("cc").value=h}
(function(){
 var box=document.getElementById("sws");
 PRE.forEach(function(c){var b=document.createElement("button");b.className="sw";b.dataset.c=c;b.style.background=c;b.setAttribute("aria-label","Color "+c);b.onclick=function(){setAccent(c)};box.appendChild(b)});
 var lab=document.createElement("label");lab.className="sw cust";lab.id="swc";lab.title="Elegir otro color";
 lab.innerHTML='<input type="color" id="cc" aria-label="Elegir otro color">';box.appendChild(lab);
 document.getElementById("cc").oninput=function(){setAccent(this.value)};
 var t=null,a=null;try{t=localStorage.getItem(TK);a=localStorage.getItem(AK)}catch(e){}
 if(t!="light"&&t!="dark")t=window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
 setTheme(t,true);setAccent(/^#[0-9a-f]{6}$/i.test(a||"")?a:ACC,true);
 document.getElementById("thL").onclick=function(){setTheme("light")};
 document.getElementById("thD").onclick=function(){setTheme("dark")}})();

 rd.readAsText(f)};
